    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Open Graph -->

    <meta property="og:url" content="https://woroniak.dev/" />
    <meta property="og:title" content="Woroniak.dev — Thomas Woroniak" />
    <meta property="og:description" content="Senior Front-End Developer specialising in React, TypeScript, and modern UI patterns. Portfolio of projects, case studies, and open source work." />
    <meta property="og:image" content="https://woroniak.dev/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://woroniak.dev/" />
    <meta name="twitter:title" content="Woroniak.dev — Thomas Woroniak" />
    <meta name="twitter:description" content="Senior Front-End Developer specialising in React, TypeScript, and modern UI patterns. Portfolio of projects, case studies, and open source work." />
    <meta name="twitter:image" content="https://woroniak.dev/og-image.png" />

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Thomas Woroniak",
      "url": "https://woroniak.dev",
      "jobTitle": "Senior Front-End Developer",
      "sameAs": [
        "https://github.com/tworoniak",
        "https://www.linkedin.com/in/thomasworoniak/"
      ]
    }
    </script>
    <!-- Prevent flash of wrong theme before React hydrates -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored === 'light' ? 'light' : (stored === 'dark' || prefersDark) ? 'dark' : 'light';
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Berkeley+Mono:ital,wght@0,100..700;1,100..700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
